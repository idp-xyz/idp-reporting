# Checks every pull request to main and every push to main. Third-party actions are pinned to
# full commit SHAs (tag in the trailing comment), the token is read-only and nothing runs with
# repository secrets, because the repository is public.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must equal the toolchain line in go.mod; the go job fails when they differ.
  GO_VERSION: 1.26.10
  # Use exactly that toolchain; never download another one silently.
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go format, vet, build, test and race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Toolchain matches go.mod
        run: |
          if ! grep -qx "toolchain $(go env GOVERSION)" go.mod; then
            echo "go.mod toolchain line does not match $(go env GOVERSION)"; exit 1
          fi
      - name: Verify modules and formatting
        run: |
          go mod download
          go mod verify
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Core stays standard-library-only (CODING_STANDARDS.md)
        run: |
          external="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./reporting/... | grep -v '^idp.local/reporting/reporting' || true)"
          if [ -n "$external" ]; then echo "reporting/ depends on: $external"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      # This job has neither a database nor Typst: the PostgreSQL entry tests and the Typst tests skip,
      # and run in the postgres and pdf jobs.
      - name: Test
        env:
          EXPECTED_SKIPS: TestPostgresContract TestDurablePostgresContract TestDurablePostgresIssues TestTypstExportsThroughTheService TestTypstLaysOutDocuments TestTypstFailsClosed TestTypstRefusesFontsItNamesDifferently TestTypstWithAHardCoreLimitOfZero TestTypstRendersDocuments TestTypstSlotsBoundPreviewsAndExports TestTypstIssuesDocuments
        run: python3 -I scripts/go_test_strict.py -count=1
      - name: Race
        env:
          EXPECTED_SKIPS: TestPostgresContract TestDurablePostgresContract TestDurablePostgresIssues TestTypstExportsThroughTheService TestTypstLaysOutDocuments TestTypstFailsClosed TestTypstRefusesFontsItNamesDifferently TestTypstWithAHardCoreLimitOfZero TestTypstRendersDocuments TestTypstSlotsBoundPreviewsAndExports TestTypstIssuesDocuments
        run: python3 -I scripts/go_test_strict.py -race -count=1

  postgres:
    name: PostgreSQL contract and durable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          # A throwaway server inside this job; trust mirrors scripts/run_pg16_vm.py.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # A missing DSN fails instead of skipping, and only the Typst tests, which run in the pdf job,
      # may skip in this job.
      REPORTING_S01_REQUIRE_PG: "1"
      EXPECTED_SKIPS: TestTypstExportsThroughTheService TestTypstLaysOutDocuments TestTypstFailsClosed TestTypstRefusesFontsItNamesDifferently TestTypstWithAHardCoreLimitOfZero TestTypstRendersDocuments TestTypstSlotsBoundPreviewsAndExports TestTypstIssuesDocuments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Create the guarded test databases
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for db in reporting_test_s01 reporting_source_test_s01 reporting_test_s01_race reporting_source_test_s01_race; do
            docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
      - name: Test against PostgreSQL
        env:
          REPORTING_S01_TEST_DSN: postgresql://postgres@127.0.0.1:55432/reporting_test_s01?sslmode=disable
          REPORTING_S01_SOURCE_DSN: postgresql://postgres@127.0.0.1:55432/reporting_source_test_s01?sslmode=disable
        run: python3 -I scripts/go_test_strict.py -count=1
      - name: Race against PostgreSQL
        env:
          REPORTING_S01_TEST_DSN: postgresql://postgres@127.0.0.1:55432/reporting_test_s01_race?sslmode=disable
          REPORTING_S01_SOURCE_DSN: postgresql://postgres@127.0.0.1:55432/reporting_source_test_s01_race?sslmode=disable
        run: python3 -I scripts/go_test_strict.py -race -count=1

  console:
    name: Console syntax and DOM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The DOM suite builds and starts the real Go server on loopback. The Go cache is left to the
      # go job, which otherwise loses the shared cache key to this shorter job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax
        run: |
          node --check console/assets/app.js
          node --check console/assets/dashboard.js
          node --check console/assets/documents.js
          node --check scripts/browser_visual_s03c4.mjs
      - run: node --test console/dom.test.mjs

  pdf:
    name: PDF export and document previews with the pinned Typst, fonts and veraPDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The Typst tests fail instead of skipping, in Go and in the console suite.
      REPORTING_PDF_REQUIRE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - name: Fetch the pinned Typst binary and fonts
        run: python3 -I scripts/fetch_pdf_tools.py "$RUNNER_TEMP/pdf-tools" --github-env
      - name: Allow the user namespaces of the Typst sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor. This changes only
        # the throwaway runner; export/pdf refuses to start without them.
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --net true
      - name: Typst tests and documents
        env:
          REPORTING_PDF_EVIDENCE: ${{ runner.temp }}/pdf-evidence
        run: |
          mkdir -p "$REPORTING_PDF_EVIDENCE"
          go test -count=1 -v ./export/pdf
          go test -race -count=1 ./export/pdf
      # The whole DOM suite: PDF export and document previews render through the demo server.
      - name: Console with the Typst renderer
        env:
          REPORTING_S03A_EVIDENCE_DIR: ${{ runner.temp }}/console-evidence
          REPORTING_DOCUMENT_EVIDENCE_DIR: ${{ runner.temp }}/console-evidence
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test console/dom.test.mjs
          cp "$REPORTING_S03A_EVIDENCE_DIR/console_finance.pdf" "$REPORTING_DOCUMENT_EVIDENCE_DIR/console_document_preview.pdf" "$REPORTING_DOCUMENT_EVIDENCE_DIR/console_table_preview.pdf" "$REPORTING_DOCUMENT_EVIDENCE_DIR/console_issued.pdf" "$RUNNER_TEMP/pdf-evidence/"
      - name: Check the documents, the negative controls and PDF/A-2b
        run: |
          python3 -m venv "$RUNNER_TEMP/pdfcheck"
          "$RUNNER_TEMP/pdfcheck/bin/pip" install --require-hashes --only-binary :all: --no-deps -r scripts/requirements-pdfcheck.txt
          "$RUNNER_TEMP/pdfcheck/bin/python" -I scripts/check_pdf_export.py "$RUNNER_TEMP/pdf-evidence" --negative \
            --golden export/pdf/testdata/golden.json --font "$REPORTING_PDF_FONTS/NotoSansSC-Regular.otf" \
            --verapdf verapdf/cli@sha256:d565095c67a083e693aebf7d1a15784007370571053fc1aa5b502665b9a78f9c
      - name: Keep the documents of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-evidence
          path: ${{ runner.temp }}/pdf-evidence
          retention-days: 14
