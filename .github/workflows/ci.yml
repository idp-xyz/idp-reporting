# Checks every pull request to main and every push to main. Third-party actions are pinned to
# full commit SHAs (tag in the trailing comment), the token is read-only and nothing runs with
# repository secrets, because the repository is public.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must equal the toolchain line in go.mod; the go job fails when they differ.
  GO_VERSION: 1.26.10
  # Use exactly that toolchain; never download another one silently.
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go format, vet, build, test and race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Toolchain matches go.mod
        run: |
          if ! grep -qx "toolchain $(go env GOVERSION)" go.mod; then
            echo "go.mod toolchain line does not match $(go env GOVERSION)"; exit 1
          fi
      - name: Verify modules and formatting
        run: |
          go mod download
          go mod verify
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Core stays standard-library-only (CODING_STANDARDS.md)
        run: |
          external="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./reporting/... | grep -v '^idp.local/reporting/reporting' || true)"
          if [ -n "$external" ]; then echo "reporting/ depends on: $external"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      # The two PostgreSQL entry tests are the only expected skips: this job has no database.
      - name: Test
        env:
          EXPECTED_SKIPS: TestPostgresContract TestDurablePostgresContract
        run: python3 -I scripts/go_test_strict.py -count=1
      - name: Race
        env:
          EXPECTED_SKIPS: TestPostgresContract TestDurablePostgresContract
        run: python3 -I scripts/go_test_strict.py -race -count=1

  postgres:
    name: PostgreSQL contract and durable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          # A throwaway server inside this job; trust mirrors scripts/run_pg16_vm.py.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # A missing DSN fails instead of skipping, and no test may skip in this job.
      REPORTING_S01_REQUIRE_PG: "1"
      EXPECTED_SKIPS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Create the guarded test databases
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for db in reporting_test_s01 reporting_source_test_s01 reporting_test_s01_race reporting_source_test_s01_race; do
            docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
      - name: Test against PostgreSQL
        env:
          REPORTING_S01_TEST_DSN: postgresql://postgres@127.0.0.1:55432/reporting_test_s01?sslmode=disable
          REPORTING_S01_SOURCE_DSN: postgresql://postgres@127.0.0.1:55432/reporting_source_test_s01?sslmode=disable
        run: python3 -I scripts/go_test_strict.py -count=1
      - name: Race against PostgreSQL
        env:
          REPORTING_S01_TEST_DSN: postgresql://postgres@127.0.0.1:55432/reporting_test_s01_race?sslmode=disable
          REPORTING_S01_SOURCE_DSN: postgresql://postgres@127.0.0.1:55432/reporting_source_test_s01_race?sslmode=disable
        run: python3 -I scripts/go_test_strict.py -race -count=1

  console:
    name: Console syntax and DOM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The DOM suite builds and starts the real Go server on loopback. The Go cache is left to the
      # go job, which otherwise loses the shared cache key to this shorter job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax
        run: |
          node --check console/assets/app.js
          node --check console/assets/dashboard.js
          node --check scripts/browser_visual_s03c4.mjs
      - run: node --test console/dom.test.mjs
